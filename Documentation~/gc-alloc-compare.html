<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GC Alloc Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-base: #080c14;
  --bg-surface: #0d1219;
  --bg-elevated: #141c28;
  --bg-hover: #1a2538;
  --border-subtle: #172033;
  --border-default: #1e2d44;
  --border-accent: #2a3f5f;
  --text-primary: #e4eaf4;
  --text-secondary: #8494ad;
  --text-muted: #4e6180;
  --green: #22c55e;
  --green-dim: rgba(34, 197, 94, 0.12);
  --green-glow: rgba(34, 197, 94, 0.06);
  --red: #ef4444;
  --red-dim: rgba(239, 68, 68, 0.12);
  --red-glow: rgba(239, 68, 68, 0.06);
  --teal: #06b6d4;
  --teal-dim: rgba(6, 182, 212, 0.12);
  --orange: #f59e0b;
  --orange-dim: rgba(245, 158, 11, 0.12);
  --clr-before: #e5953e;
  --clr-after: #22b8a0;
  --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', monospace;
}

body {
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
}

.hidden { display: none !important; }

/* ═══════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════ */

.header {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 28px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-brand svg { opacity: 0.5; }

.header h1 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.header-center {
  display: flex;
  gap: 20px;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
}

.header-center .file-label { color: var(--text-secondary); font-weight: 600; }
.header-center .file-sep { color: var(--border-accent); }

.header-actions {
  display: flex;
  gap: 6px;
}

.btn {
  padding: 5px 14px;
  border: 1px solid var(--border-default);
  border-radius: 6px;
  background: var(--bg-elevated);
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.btn:hover { background: var(--bg-hover); border-color: var(--border-accent); color: var(--text-primary); }

/* ═══════════════════════════════════════════════════
   LANDING / DROP ZONES
   ═══════════════════════════════════════════════════ */

.landing {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 28px;
  min-height: calc(100vh - 52px);
}

.landing h2 {
  font-size: 32px;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.landing p {
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 48px;
}

.drop-zones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  width: 100%;
  max-width: 680px;
}

.drop-zone {
  border: 2px dashed var(--border-default);
  border-radius: 12px;
  padding: 44px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  background: var(--bg-surface);
}

.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--border-accent);
  background: var(--bg-elevated);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.drop-zone.loaded {
  border-color: var(--green);
  border-style: solid;
  background: var(--green-glow);
}

.drop-zone-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.drop-zone-hint {
  font-size: 12px;
  color: var(--text-muted);
}

.drop-zone-summary {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--green);
  line-height: 1.7;
}

.drop-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

/* ═══════════════════════════════════════════════════
   SUMMARY CARDS
   ═══════════════════════════════════════════════════ */

.comparison { padding: 24px 28px; }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.summary-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}

.summary-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--border-accent);
}

.card-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.card-hero {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.card-sub {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.card-sub .arrow { color: var(--text-muted); font-size: 10px; }

.card-detail {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.card-detail .dot { color: var(--text-muted); margin: 0 4px; }

.clr-green { color: var(--green); }
.clr-red { color: var(--red); }
.clr-teal { color: var(--teal); }
.clr-orange { color: var(--orange); }
.clr-muted { color: var(--text-muted); }
.clr-before { color: var(--clr-before); }
.clr-after { color: var(--clr-after); }

/* ═══════════════════════════════════════════════════
   PAIRED BAR CHART
   ═══════════════════════════════════════════════════ */

.chart-section {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 20px;
}

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.chart-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}

.chart-legend {
  display: flex;
  gap: 16px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
}

.chart-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.chart-legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 2px;
}

.chart-legend-swatch.swatch-before { background: var(--clr-before); }
.chart-legend-swatch.swatch-after { background: var(--clr-after); }

.chart-section .table-wrap { border: none; }

/* ═══════════════════════════════════════════════════
   TOOLBAR (FILTER BAR)
   ═══════════════════════════════════════════════════ */

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.toolbar input {
  padding: 7px 12px;
  border: 1px solid var(--border-default);
  border-radius: 6px;
  background: var(--bg-surface);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 13px;
  width: 200px;
  outline: none;
  transition: border-color 0.15s;
}

.toolbar input:focus { border-color: var(--border-accent); }
.toolbar input::placeholder { color: var(--text-muted); }

.toolbar input.exclude { width: 160px; }

.pill-group {
  display: flex;
  gap: 4px;
}

.pill {
  padding: 4px 10px;
  border: 1px solid var(--border-default);
  border-radius: 16px;
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.pill:hover { border-color: var(--border-accent); color: var(--text-secondary); }
.pill.active { background: var(--bg-elevated); border-color: var(--border-accent); color: var(--text-primary); }
.pill .pill-count { color: var(--text-muted); margin-left: 2px; }

.result-count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
}

/* ═══════════════════════════════════════════════════
   TABLE
   ═══════════════════════════════════════════════════ */

.table-wrap {
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  overflow: hidden;
}

.table-scroll { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-default);
  border-right: 1px solid var(--border-subtle);
  padding: 10px 14px;
  text-align: left;
  font-family: var(--font-sans);
  font-weight: 700;
  color: var(--text-muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 10;
}

th:hover { color: var(--text-secondary); }

th .sort-arrow {
  margin-left: 3px;
  font-size: 9px;
  color: var(--border-accent);
}

th.num { text-align: right; }

th:last-child { border-right: none; }

td {
  padding: 6px 14px;
  border-bottom: 1px solid var(--border-subtle);
  border-right: 1px solid var(--border-subtle);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  line-height: 1.3;
}

td:last-child { border-right: none; }

td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

td.name-cell {
  max-width: 420px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-primary);
}

tr:hover td { background: var(--bg-hover); }

tr.row-regressed td { background: var(--red-glow); }
tr.row-regressed:hover td { background: var(--red-dim); }

.badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 4px;
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.badge-improved { background: var(--green-dim); color: var(--green); }
.badge-regressed { background: var(--red-dim); color: var(--red); }
.badge-new { background: var(--orange-dim); color: var(--orange); }
.badge-removed { background: var(--teal-dim); color: var(--teal); }
.badge-unchanged { background: rgba(100,100,120,0.12); color: var(--text-muted); }

.bar-cell {
  min-width: 120px;
  padding: 6px 4px;
}

.bar-cell .bar-wrap {
  display: flex;
  height: 14px;
}

.bar-cell .bar-fill {
  height: 100%;
  border-radius: 2px;
}

.bar-before .bar-wrap { justify-content: flex-end; }
.bar-before .bar-fill { background: var(--clr-before); }

.bar-after .bar-wrap { justify-content: flex-start; }
.bar-after .bar-fill { background: var(--clr-after); }

@media (max-width: 1200px) {
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 768px) {
  .summary-grid { grid-template-columns: 1fr; }
  .drop-zones { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
    <h1>GC Alloc Compare</h1>
  </div>
  <div class="header-center" id="headerFiles"></div>
  <div class="header-actions hidden" id="headerActions">
    <button class="btn" id="swapBtn">Swap</button>
    <button class="btn" id="resetBtn">Reset</button>
  </div>
</div>

<div class="landing" id="landing">
  <h2>Compare GC Allocations</h2>
  <p>Drop two marker-table CSVs to visualize allocation changes</p>
  <div class="drop-zones">
    <div class="drop-zone" id="dropBefore">
      <input type="file" accept=".csv" data-slot="before">
      <div class="drop-zone-label">Before (Baseline)</div>
      <div class="drop-zone-hint">Drop CSV or click to browse</div>
      <div class="drop-zone-summary" id="summaryBefore"></div>
    </div>
    <div class="drop-zone" id="dropAfter">
      <input type="file" accept=".csv" data-slot="after">
      <div class="drop-zone-label">After (Optimized)</div>
      <div class="drop-zone-hint">Drop CSV or click to browse</div>
      <div class="drop-zone-summary" id="summaryAfter"></div>
    </div>
  </div>
</div>

<div class="comparison hidden" id="comparison">
  <div class="summary-grid" id="summaryCards"></div>

  <div class="chart-section">
    <div class="chart-header">
      <div class="chart-title">Top Changes by Impact</div>
      <div class="chart-legend">
        <div class="chart-legend-item"><div class="chart-legend-swatch swatch-before"></div> Before</div>
        <div class="chart-legend-item"><div class="chart-legend-swatch swatch-after"></div> After</div>
      </div>
    </div>
    <div class="table-wrap"><div class="table-scroll">
      <table id="tornadoChart"></table>
    </div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="nameFilter" placeholder="Filter methods...">
    <input type="text" id="excludeFilter" class="exclude" placeholder="Exclude...">
    <div class="pill-group" id="pillGroup">
      <button class="pill active" data-cat="all">All</button>
      <button class="pill" data-cat="improved">Improved</button>
      <button class="pill" data-cat="regressed">Regressed</button>
      <button class="pill" data-cat="new">New</button>
      <button class="pill" data-cat="removed">Removed</button>
      <button class="pill" data-cat="unchanged">Unchanged</button>
    </div>
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="table-wrap">
    <div class="table-scroll">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════

var STATUS = {
  IMPROVED:  'improved',
  REGRESSED: 'regressed',
  NEW:       'new',
  REMOVED:   'removed',
  UNCHANGED: 'unchanged'
};

var STORAGE = {
  BEFORE:      'gccompare_before',
  BEFORE_NAME: 'gccompare_before_name',
  AFTER:       'gccompare_after',
  AFTER_NAME:  'gccompare_after_name'
};

var CSV = {
  NAME:  'Name',
  BYTES: 'Bytes',
  COUNT: 'Count',
  MEAN:  'Mean/Frame'
};

var FILTER_ALL = 'all';
var CHART_TOP_N = 14;

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════

var beforeData = null;
var afterData = null;
var beforeCsv = '';
var afterCsv = '';
var beforeName = '';
var afterName = '';
var compResult = null;
var sortCol = 'absDeltaBytes';
var sortDisplayCol = 'absDeltaBytes';
var sortAsc = false;
var filterCategory = FILTER_ALL;
var filterText = '';
var excludeText = '';

// ═══════════════════════════════════════════════════
//  CSV PARSER (RFC 4180)
// ═══════════════════════════════════════════════════

function parseCSV(text) {
  var lines = [];
  var row = [];
  var field = '';
  var inQuotes = false;
  var i = 0;
  var len = text.length;

  while (i < len) {
    var ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (i + 1 < len && text[i + 1] === '"') { field += '"'; i += 2; }
        else { inQuotes = false; i++; }
      } else { field += ch; i++; }
    } else {
      if (ch === '"') { inQuotes = true; i++; }
      else if (ch === ',') { row.push(field); field = ''; i++; }
      else if (ch === '\r') { row.push(field); field = ''; lines.push(row); row = []; i++; if (i < len && text[i] === '\n') i++; }
      else if (ch === '\n') { row.push(field); field = ''; lines.push(row); row = []; i++; }
      else { field += ch; i++; }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); lines.push(row); }
  if (lines.length < 2) return [];

  var headers = lines[0];
  var rows = [];
  for (var r = 1; r < lines.length; r++) {
    var cols = lines[r];
    if (cols.length < 2) continue;
    var obj = {};
    for (var c = 0; c < headers.length; c++)
      obj[headers[c].trim()] = c < cols.length ? cols[c].trim() : '';
    rows.push(obj);
  }
  return rows;
}

function parseNum(val) { var n = parseFloat(val); return isNaN(n) ? 0 : n; }

// ═══════════════════════════════════════════════════
//  FORMATTING
// ═══════════════════════════════════════════════════

function formatBytes(bytes) {
  var abs = Math.abs(bytes);
  if (abs >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
  if (abs >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return bytes + ' B';
}

function formatDelta(bytes) {
  if (bytes === 0) return '0 B';
  return (bytes > 0 ? '+' : '') + formatBytes(bytes);
}

function formatPct(pct) {
  if (!isFinite(pct)) return 'new';
  if (pct === 0) return '0%';
  return (pct > 0 ? '+' : '') + pct.toFixed(1) + '%';
}

function formatCount(n) {
  var abs = Math.abs(n);
  var sign = n < 0 ? '-' : '';
  if (abs >= 1000000) return sign + (abs / 1000000).toFixed(1) + 'M';
  if (abs >= 1000) return sign + (abs / 1000).toFixed(1) + 'K';
  return '' + n;
}

function clr(val) { return val < 0 ? 'clr-green' : val > 0 ? 'clr-red' : 'clr-muted'; }

function renderBarPair(deltaBytes, absDeltaBytes, maxAbsDelta) {
  var barPct = maxAbsDelta > 0 ? Math.max(1, Math.round((absDeltaBytes / maxAbsDelta) * 100)) : 0;
  var h = '<td class="bar-cell bar-before"><div class="bar-wrap">';
  if (deltaBytes < 0) h += '<div class="bar-fill" style="width:' + barPct + '%"></div>';
  h += '</div></td>';
  h += '<td class="bar-cell bar-after"><div class="bar-wrap">';
  if (deltaBytes > 0) h += '<div class="bar-fill" style="width:' + barPct + '%"></div>';
  h += '</div></td>';
  return h;
}

function truncateName(name) {
  var short = name;
  var dblColon = short.lastIndexOf('::');
  if (dblColon > 0) short = short.substring(dblColon + 2);
  var dashIdx = short.indexOf(' \u2014 ');
  if (dashIdx === -1) dashIdx = short.indexOf('\u2014');
  if (dashIdx > 0) short = short.substring(0, dashIdx);
  var parenIdx = short.indexOf('(');
  if (parenIdx > 0) short = short.substring(0, parenIdx) + '()';
  return short;
}

// ═══════════════════════════════════════════════════
//  COMPARISON ENGINE
// ═══════════════════════════════════════════════════

function buildComparison(before, after) {
  var beforeMap = {}, totalBytesBefore = 0, totalCountBefore = 0;
  for (var i = 0; i < before.length; i++) {
    beforeMap[before[i][CSV.NAME]] = before[i];
    totalBytesBefore += parseNum(before[i][CSV.BYTES]);
    totalCountBefore += parseNum(before[i][CSV.COUNT]);
  }

  var afterMap = {}, totalBytesAfter = 0, totalCountAfter = 0;
  for (var i = 0; i < after.length; i++) {
    afterMap[after[i][CSV.NAME]] = after[i];
    totalBytesAfter += parseNum(after[i][CSV.BYTES]);
    totalCountAfter += parseNum(after[i][CSV.COUNT]);
  }

  var allNames = {};
  for (var i = 0; i < before.length; i++) allNames[before[i][CSV.NAME]] = true;
  for (var i = 0; i < after.length; i++) allNames[after[i][CSV.NAME]] = true;

  var results = [];
  var names = Object.keys(allNames);
  for (var i = 0; i < names.length; i++) {
    var name = names[i];
    var bRow = beforeMap[name], aRow = afterMap[name];
    var entry = { name: name };

    if (bRow && aRow) {
      entry.beforeBytes = parseNum(bRow[CSV.BYTES]);
      entry.afterBytes = parseNum(aRow[CSV.BYTES]);
      entry.deltaBytes = entry.afterBytes - entry.beforeBytes;
      entry.deltaPct = entry.beforeBytes !== 0 ? (entry.deltaBytes / entry.beforeBytes) * 100 : 0;
      entry.beforeMean = parseNum(bRow[CSV.MEAN]);
      entry.afterMean = parseNum(aRow[CSV.MEAN]);
      entry.deltaMean = entry.afterMean - entry.beforeMean;
      entry.beforeCount = parseNum(bRow[CSV.COUNT]);
      entry.afterCount = parseNum(aRow[CSV.COUNT]);
      entry.deltaCount = entry.afterCount - entry.beforeCount;
      entry.status = entry.deltaBytes < 0 ? STATUS.IMPROVED : entry.deltaBytes > 0 ? STATUS.REGRESSED : STATUS.UNCHANGED;
    } else if (bRow) {
      entry.beforeBytes = parseNum(bRow[CSV.BYTES]);
      entry.afterBytes = null;
      entry.deltaBytes = -entry.beforeBytes;
      entry.deltaPct = -100;
      entry.beforeMean = parseNum(bRow[CSV.MEAN]);
      entry.afterMean = null;
      entry.deltaMean = -entry.beforeMean;
      entry.beforeCount = parseNum(bRow[CSV.COUNT]);
      entry.afterCount = null;
      entry.deltaCount = -entry.beforeCount;
      entry.status = STATUS.REMOVED;
    } else {
      entry.beforeBytes = null;
      entry.afterBytes = parseNum(aRow[CSV.BYTES]);
      entry.deltaBytes = entry.afterBytes;
      entry.deltaPct = Infinity;
      entry.beforeMean = null;
      entry.afterMean = parseNum(aRow[CSV.MEAN]);
      entry.deltaMean = entry.afterMean;
      entry.beforeCount = null;
      entry.afterCount = parseNum(aRow[CSV.COUNT]);
      entry.deltaCount = entry.afterCount;
      entry.status = STATUS.NEW;
    }
    entry.absDeltaBytes = Math.abs(entry.deltaBytes);
    entry.improvementMag = entry.deltaBytes < 0 ? -entry.deltaBytes : 0;
    entry.regressionMag = entry.deltaBytes > 0 ? entry.deltaBytes : 0;
    results.push(entry);
  }

  return { rows: results, totalBytesBefore: totalBytesBefore, totalBytesAfter: totalBytesAfter, totalCountBefore: totalCountBefore, totalCountAfter: totalCountAfter };
}

// ═══════════════════════════════════════════════════
//  RENDERING — SUMMARY CARDS
// ═══════════════════════════════════════════════════

function renderSummary(comp) {
  var deltaBytes = comp.totalBytesAfter - comp.totalBytesBefore;
  var deltaCount = comp.totalCountAfter - comp.totalCountBefore;
  var deltaBytesPct = comp.totalBytesBefore !== 0 ? (deltaBytes / comp.totalBytesBefore) * 100 : 0;
  var deltaCountPct = comp.totalCountBefore !== 0 ? (deltaCount / comp.totalCountBefore) * 100 : 0;

  var counts = {};
  counts[STATUS.IMPROVED] = 0; counts[STATUS.REGRESSED] = 0; counts[STATUS.UNCHANGED] = 0; counts[STATUS.NEW] = 0; counts[STATUS.REMOVED] = 0;
  for (var i = 0; i < comp.rows.length; i++) counts[comp.rows[i].status]++;

  var h = '';

  // Card 1: Total Bytes
  h += '<div class="summary-card">';
  h += '<div class="card-label">Total Bytes</div>';
  h += '<div class="card-hero">' + formatDelta(deltaBytes) + '</div>';
  h += '<div class="card-sub"><span class="clr-before">' + formatBytes(comp.totalBytesBefore) + '</span><span class="arrow">&rarr;</span><span class="clr-after">' + formatBytes(comp.totalBytesAfter) + '</span></div>';
  h += '<div class="card-detail">' + formatPct(deltaBytesPct) + '</div>';
  h += '</div>';

  // Card 2: Total Allocations
  h += '<div class="summary-card">';
  h += '<div class="card-label">Total Allocations</div>';
  h += '<div class="card-hero">' + (deltaCount > 0 ? '+' : '') + formatCount(deltaCount) + '</div>';
  h += '<div class="card-sub"><span class="clr-before">' + formatCount(comp.totalCountBefore) + '</span><span class="arrow">&rarr;</span><span class="clr-after">' + formatCount(comp.totalCountAfter) + '</span></div>';
  h += '<div class="card-detail">' + formatPct(deltaCountPct) + '</div>';
  h += '</div>';

  // Card 3: Methods Changed
  h += '<div class="summary-card">';
  h += '<div class="card-label">Methods Changed</div>';
  h += '<div class="card-hero">' + (counts[STATUS.IMPROVED] + counts[STATUS.REGRESSED] + counts[STATUS.NEW] + counts[STATUS.REMOVED]) + '</div>';
  h += '<div class="card-detail">';
  h += '<span class="clr-green">' + counts[STATUS.IMPROVED] + ' improved</span><span class="dot">&middot;</span>';
  h += '<span class="clr-red">' + counts[STATUS.REGRESSED] + ' regressed</span><span class="dot">&middot;</span>';
  h += counts[STATUS.UNCHANGED] + ' unchanged';
  h += '</div></div>';

  // Card 4: Added / Removed
  h += '<div class="summary-card">';
  h += '<div class="card-label">Added / Removed</div>';
  h += '<div class="card-hero">' + (counts[STATUS.NEW] + counts[STATUS.REMOVED]) + '</div>';
  h += '<div class="card-detail">';
  h += '<span class="clr-orange">' + counts[STATUS.NEW] + ' new</span><span class="dot">&middot;</span>';
  h += '<span class="clr-teal">' + counts[STATUS.REMOVED] + ' removed</span>';
  h += '</div></div>';

  document.getElementById('summaryCards').innerHTML = h;

  // Update pill counts
  var pills = document.querySelectorAll('.pill');
  for (var i = 0; i < pills.length; i++) {
    var cat = pills[i].dataset.cat;
    if (cat === FILTER_ALL) {
      pills[i].innerHTML = 'All <span class="pill-count">' + comp.rows.length + '</span>';
    } else {
      var c = counts[cat] || 0;
      pills[i].innerHTML = cat.charAt(0).toUpperCase() + cat.slice(1) + ' <span class="pill-count">' + c + '</span>';
    }
  }
}

// ═══════════════════════════════════════════════════
//  RENDERING — PAIRED BAR CHART (sorted by Abs Diff)
// ═══════════════════════════════════════════════════

function renderTornadoChart(rows) {
  var sorted = rows.slice().sort(function(a, b) { return b.absDeltaBytes - a.absDeltaBytes; });
  var top = sorted.slice(0, CHART_TOP_N);
  if (top.length === 0) { document.getElementById('tornadoChart').innerHTML = ''; return; }

  var maxAbsDelta = top[0].absDeltaBytes;
  if (maxAbsDelta === 0) return;

  var h = '<thead><tr>';
  h += '<th>Name</th>';
  h += '<th class="num clr-before">Before</th>';
  h += '<th>&lt;</th>';
  h += '<th>&gt;</th>';
  h += '<th class="num clr-after">After</th>';
  h += '<th class="num">Abs Diff</th>';
  h += '</tr></thead><tbody>';

  for (var i = 0; i < top.length; i++) {
    var r = top[i];
    var bv = r.beforeBytes !== null ? r.beforeBytes : 0;
    var av = r.afterBytes !== null ? r.afterBytes : 0;
    var shortName = truncateName(r.name);

    h += '<tr>';
    h += '<td class="name-cell" title="' + esc(r.name) + '">' + esc(shortName) + '</td>';
    h += '<td class="num">' + (bv > 0 ? formatBytes(bv) : '-') + '</td>';
    h += renderBarPair(r.deltaBytes, r.absDeltaBytes, maxAbsDelta);
    h += '<td class="num">' + (av > 0 ? formatBytes(av) : '-') + '</td>';
    h += '<td class="num">' + formatBytes(r.absDeltaBytes) + '</td>';
    h += '</tr>';
  }

  h += '</tbody>';
  document.getElementById('tornadoChart').innerHTML = h;
}

// ═══════════════════════════════════════════════════
//  RENDERING — TABLE
// ═══════════════════════════════════════════════════

var columns = [
  { key: 'name',        label: 'Method',       num: false },
  { key: 'status',      label: 'Status',       num: false },
  { key: 'beforeBytes', label: 'Before',       num: true },
  { key: '_barBefore',  label: '&lt;',         num: false, sortKey: 'improvementMag' },
  { key: '_barAfter',   label: '&gt;',         num: false, sortKey: 'regressionMag' },
  { key: 'afterBytes',  label: 'After',        num: true },
  { key: 'deltaBytes',  label: 'Diff',         num: true },
  { key: 'absDeltaBytes', label: 'Abs Diff',   num: true },
  { key: 'deltaPct',    label: 'Change',       num: true },
  { key: 'deltaMean',   label: '\u0394 Mean/F', num: true },
  { key: 'beforeCount', label: 'Count Before', num: true },
  { key: 'afterCount',  label: 'Count After',  num: true }
];

var statusOrder = {};
statusOrder[STATUS.REGRESSED] = 0;
statusOrder[STATUS.NEW] = 1;
statusOrder[STATUS.IMPROVED] = 2;
statusOrder[STATUS.REMOVED] = 3;
statusOrder[STATUS.UNCHANGED] = 4;

function sortRows(rows) {
  var col = sortCol, asc = sortAsc;
  rows.sort(function(a, b) {
    var va, vb;
    if (col === 'name') {
      va = a.name.toLowerCase(); vb = b.name.toLowerCase();
      return asc ? (va < vb ? -1 : va > vb ? 1 : 0) : (vb < va ? -1 : vb > va ? 1 : 0);
    }
    if (col === 'status') { va = statusOrder[a.status]; vb = statusOrder[b.status]; }
    else { va = a[col]; vb = b[col]; if (va === null) va = asc ? Infinity : -Infinity; if (vb === null) vb = asc ? Infinity : -Infinity; }
    return asc ? va - vb : vb - va;
  });
}

function filterRows(rows) {
  var filtered = [];
  var text = filterText.toLowerCase();
  var excl = excludeText.toLowerCase();
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (filterCategory !== FILTER_ALL && r.status !== filterCategory) continue;
    if (text && r.name.toLowerCase().indexOf(text) === -1) continue;
    if (excl && r.name.toLowerCase().indexOf(excl) !== -1) continue;
    filtered.push(r);
  }
  return filtered;
}

function renderTable() {
  var head = document.getElementById('tableHead');
  var body = document.getElementById('tableBody');

  var hh = '<tr>';
  for (var i = 0; i < columns.length; i++) {
    var c = columns[i];
    var effectiveKey = c.sortKey || c.key;
    var arrow = '';
    if (sortDisplayCol === c.key)
      arrow = '<span class="sort-arrow">' + (sortAsc ? '\u25B2' : '\u25BC') + '</span>';
    hh += '<th class="' + (c.num ? 'num' : '') + '" data-col="' + c.key + '">' + c.label + arrow + '</th>';
  }
  hh += '</tr>';
  head.innerHTML = hh;

  var rows = compResult.rows;
  var visible = filterRows(rows);
  sortRows(visible);
  document.getElementById('resultCount').textContent = visible.length + ' / ' + rows.length;

  // Shared scale: both < and > bars scaled against the same max absolute delta
  var maxAbsDelta = 0;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].absDeltaBytes > maxAbsDelta) maxAbsDelta = rows[i].absDeltaBytes;
  }

  var rh = '';
  for (var i = 0; i < visible.length; i++) {
    var r = visible[i];
    rh += '<tr' + (r.status === STATUS.REGRESSED ? ' class="row-regressed"' : '') + '>';
    rh += '<td class="name-cell" title="' + esc(r.name) + '">' + esc(r.name) + '</td>';
    rh += '<td><span class="badge badge-' + r.status + '">' + r.status + '</span></td>';
    rh += '<td class="num">' + (r.beforeBytes !== null ? formatBytes(r.beforeBytes) : '-') + '</td>';
    rh += renderBarPair(r.deltaBytes, r.absDeltaBytes, maxAbsDelta);

    rh += '<td class="num">' + (r.afterBytes !== null ? formatBytes(r.afterBytes) : '-') + '</td>';
    rh += '<td class="num">' + formatDelta(r.deltaBytes) + '</td>';
    rh += '<td class="num">' + formatBytes(r.absDeltaBytes) + '</td>';
    rh += '<td class="num">' + formatPct(r.deltaPct) + '</td>';
    rh += '<td class="num">' + formatDelta(Math.round(r.deltaMean)) + '</td>';
    rh += '<td class="num">' + (r.beforeCount !== null ? formatCount(r.beforeCount) : '-') + '</td>';
    rh += '<td class="num">' + (r.afterCount !== null ? formatCount(r.afterCount) : '-') + '</td>';
    rh += '</tr>';
  }
  body.innerHTML = rh;
}

function renderHeader() {
  var el = document.getElementById('headerFiles');
  var actions = document.getElementById('headerActions');
  if (beforeData && afterData) {
    el.innerHTML = '<span class="file-label clr-before">Before:</span> ' + esc(beforeName) + ' <span class="file-sep">&middot;</span> <span class="file-label clr-after">After:</span> ' + esc(afterName);
    actions.classList.remove('hidden');
  } else {
    el.innerHTML = '';
    actions.classList.add('hidden');
  }
}

function esc(str) { var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

// ═══════════════════════════════════════════════════
//  FILE LOADING
// ═══════════════════════════════════════════════════

function loadFile(file, slot) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var csv = e.target.result;
    var rows = parseCSV(csv);
    if (rows.length === 0) return;
    if (slot === 'before') { beforeData = rows; beforeCsv = csv; beforeName = file.name; updateDropZone('before', rows, file.name); }
    else { afterData = rows; afterCsv = csv; afterName = file.name; updateDropZone('after', rows, file.name); }
    var keys = slot === 'before' ? [STORAGE.BEFORE, STORAGE.BEFORE_NAME] : [STORAGE.AFTER, STORAGE.AFTER_NAME];
    try { localStorage.setItem(keys[0], csv); localStorage.setItem(keys[1], file.name); } catch(e) {}
    if (beforeData && afterData) showComparison();
  };
  reader.readAsText(file);
}

function updateDropZone(slot, rows, fileName) {
  var zone = document.getElementById(slot === 'before' ? 'dropBefore' : 'dropAfter');
  var summary = document.getElementById(slot === 'before' ? 'summaryBefore' : 'summaryAfter');
  zone.classList.add('loaded');
  var totalBytes = 0, totalCount = 0;
  for (var i = 0; i < rows.length; i++) { totalBytes += parseNum(rows[i][CSV.BYTES]); totalCount += parseNum(rows[i][CSV.COUNT]); }
  summary.innerHTML = '<strong>' + esc(fileName) + '</strong><br>' + rows.length + ' methods &middot; ' + formatBytes(totalBytes) + ' &middot; ' + formatCount(totalCount) + ' allocs';
}

function showComparison() {
  compResult = buildComparison(beforeData, afterData);
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('comparison').classList.remove('hidden');
  renderHeader();
  renderSummary(compResult);
  renderTornadoChart(compResult.rows);
  renderTable();
}

function reset() {
  beforeData = null; afterData = null; beforeCsv = ''; afterCsv = ''; beforeName = ''; afterName = '';
  compResult = null;
  sortCol = 'absDeltaBytes'; sortDisplayCol = 'absDeltaBytes'; sortAsc = false;
  try { localStorage.removeItem(STORAGE.BEFORE); localStorage.removeItem(STORAGE.BEFORE_NAME); localStorage.removeItem(STORAGE.AFTER); localStorage.removeItem(STORAGE.AFTER_NAME); } catch(e) {}
  filterCategory = FILTER_ALL; filterText = ''; excludeText = '';
  document.getElementById('landing').classList.remove('hidden');
  document.getElementById('comparison').classList.add('hidden');
  document.getElementById('headerFiles').innerHTML = '';
  document.getElementById('headerActions').classList.add('hidden');
  var zones = document.querySelectorAll('.drop-zone');
  for (var i = 0; i < zones.length; i++) zones[i].classList.remove('loaded');
  document.getElementById('summaryBefore').innerHTML = '';
  document.getElementById('summaryAfter').innerHTML = '';
  document.getElementById('nameFilter').value = '';
  document.getElementById('excludeFilter').value = '';
  var pills = document.querySelectorAll('.pill');
  for (var i = 0; i < pills.length; i++) pills[i].classList.toggle('active', pills[i].dataset.cat === FILTER_ALL);
}

// ═══════════════════════════════════════════════════
//  EVENT HANDLERS
// ═══════════════════════════════════════════════════

function setupDropZone(zoneId, slot) {
  var zone = document.getElementById(zoneId);
  zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', function() { zone.classList.remove('drag-over'); });
  zone.addEventListener('drop', function(e) { e.preventDefault(); zone.classList.remove('drag-over'); if (e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0], slot); });
  zone.querySelector('input[type="file"]').addEventListener('change', function() { if (this.files.length > 0) loadFile(this.files[0], slot); });
}

setupDropZone('dropBefore', 'before');
setupDropZone('dropAfter', 'after');

document.getElementById('swapBtn').addEventListener('click', function() {
  var td = beforeData, tc = beforeCsv, tn = beforeName;
  beforeData = afterData; beforeCsv = afterCsv; beforeName = afterName;
  afterData = td; afterCsv = tc; afterName = tn;
  try { localStorage.setItem(STORAGE.BEFORE, beforeCsv); localStorage.setItem(STORAGE.BEFORE_NAME, beforeName); localStorage.setItem(STORAGE.AFTER, afterCsv); localStorage.setItem(STORAGE.AFTER_NAME, afterName); } catch(e) {}
  showComparison();
});

document.getElementById('resetBtn').addEventListener('click', reset);

document.getElementById('nameFilter').addEventListener('input', function() { filterText = this.value; renderTable(); });
document.getElementById('excludeFilter').addEventListener('input', function() { excludeText = this.value; renderTable(); });

var allPills = document.querySelectorAll('.pill');
for (var i = 0; i < allPills.length; i++) {
  allPills[i].addEventListener('click', function() {
    filterCategory = this.dataset.cat;
    for (var j = 0; j < allPills.length; j++) allPills[j].classList.toggle('active', allPills[j].dataset.cat === filterCategory);
    renderTable();
  });
}

document.getElementById('tableHead').addEventListener('click', function(e) {
  var th = e.target.closest('th');
  if (!th) return;
  var col = th.dataset.col;
  if (!col) return;

  // Resolve the actual sort key from the column definition
  var actualKey = col;
  for (var i = 0; i < columns.length; i++) {
    if (columns[i].key === col && columns[i].sortKey) {
      actualKey = columns[i].sortKey;
      break;
    }
  }

  if (sortDisplayCol === col) sortAsc = !sortAsc;
  else sortAsc = actualKey === 'name';

  sortCol = actualKey;
  sortDisplayCol = col;
  renderTable();
});

document.addEventListener('dragover', function(e) { if (beforeData && afterData) e.preventDefault(); });
document.addEventListener('drop', function(e) { if (beforeData && afterData) e.preventDefault(); });

// Restore from localStorage on page load
(function() {
  try {
    var bCsv = localStorage.getItem(STORAGE.BEFORE);
    var bName = localStorage.getItem(STORAGE.BEFORE_NAME);
    var aCsv = localStorage.getItem(STORAGE.AFTER);
    var aName = localStorage.getItem(STORAGE.AFTER_NAME);
    if (bCsv && aCsv) {
      beforeData = parseCSV(bCsv);
      beforeCsv = bCsv;
      beforeName = bName || 'before.csv';
      afterData = parseCSV(aCsv);
      afterCsv = aCsv;
      afterName = aName || 'after.csv';
      if (beforeData.length > 0 && afterData.length > 0) showComparison();
    }
  } catch(e) {}
})();
</script>
</body>
</html>
